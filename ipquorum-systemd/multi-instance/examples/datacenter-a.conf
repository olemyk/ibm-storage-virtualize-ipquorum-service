# ============================================================================
# IBM Storage Virtualize IP Quorum Instance Configuration
# ============================================================================
#
# Instance Name: datacenter-a
# Description: IBM SVC Cluster - Datacenter A (with PBHA)
# Created: 2026-04-16
#
# ============================================================================

# ============================================================================
# INSTANCE IDENTIFICATION
# ============================================================================

INSTANCE_NAME=datacenter-a
# IBM Storage System hostname/IP (used for API connectivity)
IBM_STORAGE_SYSTEM="192.168.10.50"
IBM_STORAGE_DESCRIPTION="IBM SVC Cluster - Datacenter A (PBHA Configuration)"
IBM_STORAGE_LOCATION="Datacenter A, Building 2, Floor 3"

# ============================================================================
# BASIC CONFIGURATION
# ============================================================================

IPQUORUM_DIR=/var/lib/ipquorum/datacenter-a
IPQUORUM_JAR=${IPQUORUM_DIR}/ip_quorum.jar
IPQUORUM_LOG_DIR=/var/log/ipquorum/datacenter-a
IPQUORUM_USER=ipquorum
IPQUORUM_GROUP=ipquorum

# ============================================================================
# DOWNLOAD CONFIGURATION
# ============================================================================

IPQUORUM_DOWNLOAD_ENABLED=true
IPQUORUM_DOWNLOAD_TOOL=go
DOWNLOAD_TOOL_GO=/usr/local/bin/ipquorum-download-go
DOWNLOAD_TOOL_PYTHON=/usr/local/bin/ipquorum-download.py
DOWNLOAD_TOOL_BASH=/usr/local/bin/ipquorum-restapi-download.sh
IPQUORUM_BACKUP_ENABLED=true

# ============================================================================
# STORAGE VIRTUALIZE API CONFIGURATION
# ============================================================================

API_ENDPOINT=192.168.10.50
VIRTUALIZE_USERNAME=admin
# Password file location - stored in /var/lib for proper SELinux context
VIRTUALIZE_PASSWORD_FILE=/var/lib/ipquorum/.passwords/datacenter-a.password
API_PORT=7443

# ============================================================================
# MKQUORUMAPP CONFIGURATION (PBHA Setup)
# ============================================================================

# This instance creates a new quorum app for PBHA configuration
IPQUORUM_MKQUORUMAPP_ENABLED=true
IPQUORUM_PARTNERSYSTEM=svc_cluster_remote
IPQUORUM_IP6=false
IPQUORUM_NOMETADATA=false
IPQUORUM_PARTNERIP6=false

# ============================================================================
# TLS/SSL CONFIGURATION
# ============================================================================

IPQUORUM_TLS_VERIFY=false

# ============================================================================
# IP QUORUM APPLICATION OPTIONS
# ============================================================================

# Note: Instance name sanitized for IP Quorum (no dashes allowed)
IPQUORUM_NAME=datacenterA
IPQUORUM_DEBUG=false
IPQUORUM_EMIT=false
IPQUORUM_LOG_LOCATION=${IPQUORUM_LOG_DIR}/ip_quorum.log
IPQUORUM_LOG_ROTATION=7
IPQUORUM_LOG_SIZE=10240

# ============================================================================
# RESOURCE LIMITS
# ============================================================================

# Higher limits for production PBHA system
IPQUORUM_MEMORY_MAX=1G
IPQUORUM_CPU_QUOTA=75%

# ============================================================================
# ADVANCED CONFIGURATION
# ============================================================================

JAVA_BIN=/usr/bin/java
JAVA_OPTS="-Xmx768m -Xms256m"
DOWNLOAD_TIMEOUT=300
MAX_RETRIES=10
BASE_DELAY=5

# ============================================================================
# MONITORING & ALERTING
# ============================================================================

IPQUORUM_HEALTH_CHECK_ENABLED=true
IPQUORUM_HEALTH_CHECK_INTERVAL=30
IPQUORUM_ALERT_EMAIL=storage-admin@example.com




