# ============================================================================
# IBM Storage Virtualize IP Quorum Instance Configuration
# ============================================================================
#
# Instance Name: partition-prod
# Description: IBM FlashSystem - Production Partition (Secure TLS)
# Created: 2026-04-16
#
# ============================================================================

# ============================================================================
# INSTANCE IDENTIFICATION
# ============================================================================

INSTANCE_NAME=partition-prod
# IBM Storage System hostname/IP (used for API connectivity)
IBM_STORAGE_SYSTEM="sv-prod.example.com"
IBM_STORAGE_DESCRIPTION="IBM FlashSystem 5200 - Production Partition"
IBM_STORAGE_LOCATION="Primary Datacenter, Secure Zone"

# ============================================================================
# BASIC CONFIGURATION
# ============================================================================

IPQUORUM_DIR=/var/lib/ipquorum/partition-prod
IPQUORUM_JAR=${IPQUORUM_DIR}/ip_quorum.jar
IPQUORUM_LOG_DIR=/var/log/ipquorum/partition-prod
IPQUORUM_USER=ipquorum
IPQUORUM_GROUP=ipquorum

# ============================================================================
# DOWNLOAD CONFIGURATION
# ============================================================================

IPQUORUM_DOWNLOAD_ENABLED=true
# Using Python tool for this instance
IPQUORUM_DOWNLOAD_TOOL=python
DOWNLOAD_TOOL_GO=/usr/local/bin/ipquorum-download-go
DOWNLOAD_TOOL_PYTHON=/usr/local/bin/ipquorum-download.py
DOWNLOAD_TOOL_BASH=/usr/local/bin/ipquorum-restapi-download.sh
IPQUORUM_BACKUP_ENABLED=true

# ============================================================================
# STORAGE VIRTUALIZE API CONFIGURATION
# ============================================================================

# Using hostname instead of IP for this production system
API_ENDPOINT=sv-prod.example.com
VIRTUALIZE_USERNAME=quorum_service
# Password file location - stored in /var/lib for proper SELinux context
VIRTUALIZE_PASSWORD_FILE=/var/lib/ipquorum/.passwords/partition-prod.password
API_PORT=7443

# ============================================================================
# MKQUORUMAPP CONFIGURATION
# ============================================================================

IPQUORUM_MKQUORUMAPP_ENABLED=false
IPQUORUM_PARTNERSYSTEM=
IPQUORUM_IP6=false
IPQUORUM_NOMETADATA=false
IPQUORUM_PARTNERIP6=false

# ============================================================================
# TLS/SSL CONFIGURATION
# ============================================================================

# This production system uses valid TLS certificates
IPQUORUM_TLS_VERIFY=true

# ============================================================================
# IP QUORUM APPLICATION OPTIONS
# ============================================================================

# Note: Instance name sanitized for IP Quorum (no dashes allowed)
IPQUORUM_NAME=partitionprod
# Enable debug for initial deployment
IPQUORUM_DEBUG=true
IPQUORUM_EMIT=false
IPQUORUM_LOG_LOCATION=${IPQUORUM_LOG_DIR}/ip_quorum.log
# Keep more logs for production troubleshooting
IPQUORUM_LOG_ROTATION=10
IPQUORUM_LOG_SIZE=10240

# ============================================================================
# RESOURCE LIMITS
# ============================================================================

# Conservative limits for shared environment
IPQUORUM_MEMORY_MAX=256M
IPQUORUM_CPU_QUOTA=25%

# ============================================================================
# ADVANCED CONFIGURATION
# ============================================================================

JAVA_BIN=/usr/bin/java
JAVA_OPTS="-Xmx200m -Xms128m"
DOWNLOAD_TIMEOUT=300
MAX_RETRIES=8
BASE_DELAY=3

# ============================================================================
# MONITORING & ALERTING
# ============================================================================

IPQUORUM_HEALTH_CHECK_ENABLED=true
IPQUORUM_HEALTH_CHECK_INTERVAL=60
IPQUORUM_ALERT_EMAIL=prod-storage-team@example.com




