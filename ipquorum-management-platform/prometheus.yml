global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'ipquorum-monitor'

scrape_configs:
  # IPQuorum Management Server
  - job_name: 'ipquorum-server'
    static_configs:
      - targets: ['ipquorum-server:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']


