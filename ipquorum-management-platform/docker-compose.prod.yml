version: '3.8'

services:
  # Backend API Server
  ipquorum-server:
    image: ghcr.io/olemyk/ipquorum-manager:3.0.2
    container_name: ipquorum-server
    ports:
      - "8443:8080"
    environment:
      # Database
      - DB_PATH=/data/ipquorum.db
      
      # Security
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-24h}
      
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      
      # Scripts
      - SCRIPTS_DIR=/app/scripts
      
      # IPQuorum Agent Configuration
      - IPQUORUM_AGENT_ENABLED=${IPQUORUM_AGENT_ENABLED:-false}
      - IPQUORUM_AGENT_HOST=${IPQUORUM_AGENT_HOST:-}
      - IPQUORUM_AGENT_PORT=${IPQUORUM_AGENT_PORT:-9090}
      - IPQUORUM_AGENT_API_KEY=${IPQUORUM_AGENT_API_KEY:-}
      - IPQUORUM_AGENT_TLS_ENABLED=${IPQUORUM_AGENT_TLS_ENABLED:-true}
      - IPQUORUM_AGENT_TLS_VERIFY=${IPQUORUM_AGENT_TLS_VERIFY:-true}
      
      # Performance
      - MAX_CONCURRENT_OPERATIONS=${MAX_CONCURRENT_OPERATIONS:-10}
      - OPERATION_TIMEOUT=${OPERATION_TIMEOUT:-300s}
    volumes:
      - ./data:/data
      - ./scripts:/app/scripts:ro
      - ./logs:/var/log/ipquorum
    healthcheck:
      test:
        - "CMD"
        - "wget"
        - "--no-verbose"
        - "--tries=1"
        - "--spider"
        - "http://localhost:8080/health"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - ipquorum-network
    labels:
      - "com.ipquorum.service=api-server"
      - "com.ipquorum.version=3.0.1"
      - "com.ipquorum.component=manager"
      - "org.opencontainers.image.source=https://github.com/olemyk/ibm-storage-virtualize-ipquorum-service"
      - "org.opencontainers.image.description=IP Quorum Management Platform - Backend API Server"
      - "org.opencontainers.image.licenses=Apache-2.0"

  # Frontend Web Dashboard
  ipquorum-web:
    image: ghcr.io/olemyk/ipquorum-web:3.0.2
    container_name: ipquorum-web
    ports:
      - "${WEB_PORT:-3000}:80"
    environment:
      - NGINX_WORKER_PROCESSES=${NGINX_WORKER_PROCESSES:-auto}
      - NGINX_WORKER_CONNECTIONS=${NGINX_WORKER_CONNECTIONS:-1024}
    depends_on:
      ipquorum-server:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "wget"
        - "--no-verbose"
        - "--tries=1"
        - "--spider"
        - "http://localhost:80/"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - ipquorum-network
    labels:
      - "com.ipquorum.service=web-dashboard"
      - "com.ipquorum.version=3.0.1"
      - "com.ipquorum.component=web"
      - "org.opencontainers.image.source=https://github.com/olemyk/ibm-storage-virtualize-ipquorum-service"
      - "org.opencontainers.image.description=IP Quorum Management Platform - Web Dashboard"
      - "org.opencontainers.image.licenses=Apache-2.0"

  # Prometheus (Metrics Collection)
  prometheus:
    image: prom/prometheus:latest
    container_name: ipquorum-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    depends_on:
      ipquorum-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ipquorum-network
    labels:
      - "com.ipquorum.service=prometheus"
    profiles:
      - monitoring

  # Grafana (Metrics Visualization)
  grafana:
    image: grafana/grafana:latest
    container_name: ipquorum-grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      # Admin credentials
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      
      # Security
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      
      # Server
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3001}
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
      
      # Database
      - GF_DATABASE_TYPE=sqlite3
      - GF_DATABASE_PATH=/var/lib/grafana/grafana.db
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - ipquorum-network
    labels:
      - "com.ipquorum.service=grafana"
    profiles:
      - monitoring

  # AlertManager (Alert Routing - Optional)
  alertmanager:
    image: prom/alertmanager:latest
    container_name: ipquorum-alertmanager
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    restart: unless-stopped
    networks:
      - ipquorum-network
    labels:
      - "com.ipquorum.service=alertmanager"
    profiles:
      - monitoring

networks:
  ipquorum-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  alertmanager-data:
    driver: local

