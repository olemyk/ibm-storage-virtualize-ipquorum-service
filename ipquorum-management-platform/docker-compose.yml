version: '3.8'

services:
  # Backend API Server
  ipquorum-server:
    build:
      context: .
      dockerfile: Containerfile
    container_name: ipquorum-server
    hostname: ipquorum-server
    ports:
      - "8080:8080"
    environment:
      - DB_PATH=/data/ipquorum.db
      - JWT_SECRET=your-secret-key-change-in-production
      - LOG_LEVEL=info
      - SCRIPTS_DIR=/app/scripts
    volumes:
      - ./data:/data
      - ./scripts:/app/scripts:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      ipquorum-network:
        aliases:
          - ipquorum-server
          - backend

  # Frontend Web Dashboard
  ipquorum-web:
    build:
      context: ./web
      dockerfile: Containerfile
    container_name: ipquorum-web
    hostname: ipquorum-web
    ports:
      - "3000:80"
    depends_on:
      ipquorum-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://ipquorum-server:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      ipquorum-network:
        aliases:
          - ipquorum-web
          - frontend

  # Prometheus (optional - for metrics collection)
  prometheus:
    image: prom/prometheus:latest
    container_name: ipquorum-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - ipquorum-server
    restart: unless-stopped
    networks:
      - ipquorum-network
    profiles:
      - monitoring

  # Grafana (optional - for metrics visualization)
  grafana:
    image: grafana/grafana:latest
    container_name: ipquorum-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - ipquorum-network
    profiles:
      - monitoring

networks:
  ipquorum-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:


