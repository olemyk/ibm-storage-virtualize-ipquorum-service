name: Container Build and Push

on:
  push:
    branches:
      - main
      - 'Major-update-to-the-ipquorum-*'
    tags:
      - 'v*.*.*'
    paths:
      - 'ipquorum-management-platform/**'
      - '.github/workflows/container-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ipquorum-management-platform/**'
  workflow_dispatch:
    inputs:
      push_images:
        description: 'Push images to registry'
        required: false
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io
  MANAGER_IMAGE_NAME: ${{ github.repository_owner }}/ipquorum-manager
  WEB_IMAGE_NAME: ${{ github.repository_owner }}/ipquorum-web

jobs:
  build-manager:
    name: Build Manager Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.MANAGER_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Manager image
        uses: docker/build-push-action@v6
        with:
          context: ./ipquorum-management-platform
          file: ./ipquorum-management-platform/Containerfile
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push_images != 'false') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Test Manager image
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm ${{ env.REGISTRY }}/${{ env.MANAGER_IMAGE_NAME }}:pr-${{ github.event.pull_request.number }} --version || true

  build-web:
    name: Build Web Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: ./ipquorum-management-platform/web
          file: ./ipquorum-management-platform/web/Containerfile
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push_images != 'false') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Test Web image
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm -d --name test-web ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
          sleep 5
          docker exec test-web wget --spider http://localhost/ || true
          docker stop test-web

  integration-test:
    name: Integration Tests
    needs: [build-manager, build-web]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull images
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.MANAGER_IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
          docker pull ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}

      - name: Start services
        run: |
          cd ipquorum-management-platform
          docker compose -f docker-compose.yml up -d
          sleep 10

      - name: Run health checks
        run: |
          curl -f http://localhost:8080/health || exit 1
          curl -f http://localhost:3000/ || exit 1

      - name: Stop services
        if: always()
        run: |
          cd ipquorum-management-platform
          docker compose -f docker-compose.yml down -v

  create-release:
    name: Create Release
    needs: [build-manager, build-web]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release Notes
        id: release_notes
        run: |
          cat > release_notes.md << 'EOF'
          ## Container Images

          This release includes pre-built container images available on GitHub Container Registry:

          ### Manager (Backend)
          ```bash
          docker pull ${{ env.REGISTRY }}/${{ env.MANAGER_IMAGE_NAME }}:v${{ steps.version.outputs.VERSION }}
          ```

          ### Web Dashboard (Frontend)
          ```bash
          docker pull ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:v${{ steps.version.outputs.VERSION }}
          ```

          ### Quick Start
          ```bash
          # Download docker-compose file
          wget https://raw.githubusercontent.com/${{ github.repository }}/main/ipquorum-management-platform/docker-compose.prod.yml

          # Update image versions in docker-compose.prod.yml
          sed -i 's|image: .*ipquorum-manager.*|image: ${{ env.REGISTRY }}/${{ env.MANAGER_IMAGE_NAME }}:v${{ steps.version.outputs.VERSION }}|' docker-compose.prod.yml
          sed -i 's|image: .*ipquorum-web.*|image: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:v${{ steps.version.outputs.VERSION }}|' docker-compose.prod.yml

          # Start services
          docker compose -f docker-compose.prod.yml up -d

          # Access dashboard at http://localhost:3000
          ```

          ### Supported Platforms
          - linux/amd64
          - linux/arm64

          ### Documentation
          - [Deployment Guide](https://github.com/${{ github.repository }}/blob/main/ipquorum-management-platform/DEPLOYMENT-GUIDE.md)
          - [Docker Deployment](https://github.com/${{ github.repository }}/blob/main/ipquorum-management-platform/DOCKER-DEPLOYMENT.md)
          - [Podman Deployment](https://github.com/${{ github.repository }}/blob/main/ipquorum-management-platform/PODMAN-DEPLOYMENT.md)

          ## Changes
          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/ipquorum-management-platform/CHANGELOG.md) for detailed changes.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-scan:
    name: Security Scan
    needs: [build-manager, build-web]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      security-events: write
    
    strategy:
      matrix:
        image: [manager, web]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        run: |
          if [ "${{ matrix.image }}" == "manager" ]; then
            echo "IMAGE_NAME=${{ env.REGISTRY }}/${{ env.MANAGER_IMAGE_NAME }}" >> $GITHUB_OUTPUT
          else
            echo "IMAGE_NAME=${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}" >> $GITHUB_OUTPUT
          fi

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ${{ steps.image.outputs.IMAGE_NAME }}:${{ github.ref_name }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

