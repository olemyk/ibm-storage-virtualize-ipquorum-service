name: Tests and Security Checks

on:
  push:
    branches: [main, 'Major-update-to-the-ipquorum-*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC - catches newly published CVEs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - ipquorum-download-go
          - ipquorum-emulator
          - ipquorum-management-platform/server
          - ipquorum-management-platform/container-runtime-agent
          - ipquorum-management-platform/agent
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          SKIP_DOCKER_TESTS: 'true'
          SKIP_PODMAN_TESTS: 'true'
        run: go test -race -count=1 ./...

      # container-runtime-agent: GO-2026-4883/4887 (github.com/docker/docker) have no
      # upstream fix and affect the Docker daemon, not the client library used here.
      # Remove continue-on-error once a fixed version is published.
      - name: govulncheck
        continue-on-error: ${{ matrix.module == 'ipquorum-management-platform/container-runtime-agent' }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  web:
    name: Web (npm audit, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ipquorum-management-platform/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ipquorum-management-platform/web/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # Production dependencies only; dev-tooling advisories do not ship.
      - name: npm audit (production, high and above)
        run: npm audit --omit=dev --audit-level=high
