name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Go Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output: ipquorum-download-go-linux-amd64
          - goos: linux
            goarch: arm64
            output: ipquorum-download-go-linux-arm64
          - goos: darwin
            goarch: amd64
            output: ipquorum-download-go-darwin-amd64
          - goos: darwin
            goarch: arm64
            output: ipquorum-download-go-darwin-arm64
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      
      - name: Build binary
        working-directory: ./ipquorum-download-go
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          go build -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}" \
            -o ${{ matrix.output }} \
            main.go
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ipquorum-download-go/${{ matrix.output }}
          retention-days: 1

  package:
    name: Create Release Package
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries
      
      - name: Create release package
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          TAG_NAME=${GITHUB_REF#refs/tags/}
          RELEASE_DIR="ipquorum-service-${VERSION}"
          
          # Create release directory structure
          mkdir -p "${RELEASE_DIR}/ipquorum-downloader"
          mkdir -p "${RELEASE_DIR}/systemd"
          mkdir -p "${RELEASE_DIR}/docs"
          
          # Copy Go binaries
          find binaries -type f -name "ipquorum-download-go-*" -exec cp {} "${RELEASE_DIR}/ipquorum-downloader/" \;
          chmod +x "${RELEASE_DIR}/ipquorum-downloader/"*
          
          # Copy multi-instance system files
          cp ipquorum-systemd/multi-instance/ipquorum@.service "${RELEASE_DIR}/systemd/"
          cp ipquorum-systemd/multi-instance/ipquorum-download-multi.sh "${RELEASE_DIR}/systemd/"
          cp ipquorum-systemd/multi-instance/ipquorum-start-multi.sh "${RELEASE_DIR}/systemd/"
          cp ipquorum-systemd/multi-instance/ipquorum-validate-multi.sh "${RELEASE_DIR}/systemd/"
          cp ipquorum-systemd/multi-instance/install-ipquorum-service.sh "${RELEASE_DIR}/"
          cp ipquorum-systemd/multi-instance/ipquorum-instance-manager.sh "${RELEASE_DIR}/systemd/"
          cp ipquorum-systemd/multi-instance/instance.conf.template "${RELEASE_DIR}/systemd/"
          
          # Copy multi-instance examples
          mkdir -p "${RELEASE_DIR}/systemd/examples"
          cp ipquorum-systemd/multi-instance/examples/*.conf "${RELEASE_DIR}/systemd/examples/"
          
          # Copy multi-instance troubleshooting tools
          mkdir -p "${RELEASE_DIR}/systemd/troubleshoot-tools"
          cp ipquorum-systemd/multi-instance/troubleshoot-tools/*.sh "${RELEASE_DIR}/systemd/troubleshoot-tools/"
          
          # Make scripts executable
          chmod +x "${RELEASE_DIR}/install-ipquorum-service.sh"
          chmod +x "${RELEASE_DIR}/systemd/"*.sh
          chmod +x "${RELEASE_DIR}/systemd/troubleshoot-tools/"*.sh
          
          # Copy documentation
          cp ipquorum-systemd/multi-instance/README.md "${RELEASE_DIR}/docs/"
          cp ipquorum-systemd/multi-instance/README-ADVANCED.md "${RELEASE_DIR}/docs/"
          cp ipquorum-systemd/multi-instance/QUICK-REFERENCE.md "${RELEASE_DIR}/docs/"
          cp ipquorum-systemd/multi-instance/IMPLEMENTATION-SUMMARY.md "${RELEASE_DIR}/docs/"
          cp ipquorum-systemd/multi-instance/ARCHITECTURE.md "${RELEASE_DIR}/docs/"
          cp ipquorum-systemd/multi-instance/RESOURCE-LIMITS.md "${RELEASE_DIR}/docs/" 2>/dev/null || true
          
          # Copy root documentation
          cp README.md "${RELEASE_DIR}/" 2>/dev/null || true
          cp CHANGELOG.md "${RELEASE_DIR}/" 2>/dev/null || true
          
          # Create LICENSE file if it doesn't exist
          if [ ! -f LICENSE ]; then
            echo "IBM Storage Virtualize IP Quorum Service" > "${RELEASE_DIR}/LICENSE"
          else
            cp LICENSE "${RELEASE_DIR}/"
          fi
          
          # Create VERSION file
          echo "${VERSION}" > "${RELEASE_DIR}/VERSION"
          
          # Create tarball
          tar -czf "ipquorum-service-${VERSION}.tar.gz" "${RELEASE_DIR}"
          
          # Generate checksums
          sha256sum "ipquorum-service-${VERSION}.tar.gz" > checksums.txt
          find "${RELEASE_DIR}/ipquorum-downloader/" -type f -exec sha256sum {} \; >> checksums.txt
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ipquorum-service-*.tar.gz
            checksums.txt
          body: |
            ## IBM Storage Virtualize IP Quorum Service - Multi-Instance
            
            ### 🚀 Quick Start
            
            Run multiple independent IP Quorum instances on a single host:
            
            ```bash
            # Download and extract (replace VERSION with actual version, e.g., 2.0.1)
            VERSION="2.0.1"
            wget https://github.com/${{ github.repository }}/releases/download/v${VERSION}/ipquorum-service-${VERSION}.tar.gz
            tar -xzf ipquorum-service-${VERSION}.tar.gz
            cd ipquorum-service-${VERSION}
            
            # Run installer
            chmod +x install-ipquorum-service.sh
            sudo ./install-ipquorum-service.sh
            
            # Create your first instance
            sudo ipquorum-instance-manager.sh create myinstance
            
            # Enable and start
            sudo systemctl enable --now ipquorum@myinstance.service
            ```
            
            **Direct Download (this release):**
            ```bash
            wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ipquorum-service-${VERSION}.tar.gz
            ```
            
            **Manual Binary Installation:**
            ```bash
            # Download binary for your platform
            wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ipquorum-download-go-linux-amd64
            chmod +x ipquorum-download-go-linux-amd64
            sudo mv ipquorum-download-go-linux-amd64 /usr/local/bin/ipquorum-download-go
            ```
            
            ### 📦 What's Included
            
            - ✅ Pre-built Go binaries for Linux (amd64, arm64) and macOS
            - ✅ Multi-instance systemd template service
            - ✅ Automated installation script
            - ✅ Instance management CLI tool
            - ✅ Example configurations
            - ✅ Troubleshooting tools
            - ✅ Complete documentation
            
            ### 🎯 Key Features
            
            - **Multiple Independent Instances**: Each connects to a different IBM Storage system
            - **Systemd Template Units**: Easy management with `ipquorum@<name>.service`
            - **Interactive Configuration**: Guided setup with instance manager
            - **SELinux Compatible**: Proper file contexts and permissions
            - **Auto-Download & Validation**: Automatic JAR file management
            - **Resource Limits**: Per-instance CPU and memory quotas
            - **Isolated Resources**: Separate directories, logs, and processes
            
            ### 📚 Documentation
            
            - [Quick Start Guide](docs/README.md)
            - [Advanced Guide](docs/README-ADVANCED.md)
            - [Quick Reference](docs/QUICK-REFERENCE.md)
            - [Implementation Details](docs/IMPLEMENTATION-SUMMARY.md)
            
            ### ✅ Checksums
            
            Verify your download:
            ```bash
            sha256sum -c checksums.txt
            ```
            
            ### 💡 Example Usage
            
            ```bash
            # List all instances
            sudo systemctl list-units 'ipquorum@*'
            
            # Manage instances
            sudo systemctl start ipquorum@system1.service
            sudo systemctl status ipquorum@system1.service
            
            # View logs
            sudo journalctl -u ipquorum@system1.service -f
            ```
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


