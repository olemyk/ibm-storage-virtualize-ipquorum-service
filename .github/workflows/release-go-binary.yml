name: Build and Release Go Binary

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0, v1.0.1, etc.
  workflow_dispatch:  # Allows manual trigger

permissions:
  contents: write  # Required for creating releases

jobs:
  build:
    name: Build Go Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Linux builds
          - goos: linux
            goarch: amd64
            output: ipquorum-download-go-linux-amd64
          - goos: linux
            goarch: arm64
            output: ipquorum-download-go-linux-arm64
          
          # macOS builds
          - goos: darwin
            goarch: amd64
            output: ipquorum-download-go-darwin-amd64
          - goos: darwin
            goarch: arm64
            output: ipquorum-download-go-darwin-arm64
          
          # Windows builds
          - goos: windows
            goarch: amd64
            output: ipquorum-download-go-windows-amd64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for version info

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.19'  # Match go.mod version

      - name: Get version info
        id: version
        run: |
          # Get version from tag or use dev
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "commit=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_OUTPUT

      - name: Build binary
        working-directory: ./ipquorum-download-go
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p ../dist
          go build \
            -ldflags="-s -w -X main.version=${{ steps.version.outputs.version }} -X main.commit=${{ steps.version.outputs.commit }} -X main.date=${{ steps.version.outputs.date }}" \
            -o ../dist/${{ matrix.output }} \
            main.go

      - name: Create checksums
        working-directory: ./dist
        run: |
          sha256sum ${{ matrix.output }} > ${{ matrix.output }}.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: |
            dist/${{ matrix.output }}
            dist/${{ matrix.output }}.sha256
          retention-days: 5

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Prepare release assets
        run: |
          set -e
          mkdir -p release-assets
          
          # Verify artifacts were downloaded
          if [ ! -d "dist-artifacts" ] || [ -z "$(find dist-artifacts -type f)" ]; then
            echo "Error: No artifacts found in dist-artifacts directory"
            exit 1
          fi
          
          find dist-artifacts -type f -exec cp {} release-assets/ \;
          
          # Verify files were copied
          if [ -z "$(ls -A release-assets)" ]; then
            echo "Error: No files were copied to release-assets"
            exit 1
          fi
          
          ls -lh release-assets/

      - name: Extract release notes
        id: release_notes
        run: |
          # Extract version from tag
          VERSION=${GITHUB_REF#refs/tags/}
          
          # Validate VERSION was properly extracted
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF" ]; then
            echo "Error: Failed to extract version from GITHUB_REF: $GITHUB_REF"
            exit 1
          fi
          
          # Try to extract changelog for this version
          if [ -f "ipquorum-download-go/CHANGELOG.md" ]; then
            # Extract section for this version (basic extraction)
            awk "/## \[${VERSION#v}\]/,/## \[/" ipquorum-download-go/CHANGELOG.md | head -n -1 > release_notes.md
            
            # If no specific version found, use generic message
            if [ ! -s release_notes.md ]; then
              echo "Release $VERSION" > release_notes.md
              echo "" >> release_notes.md
              echo "See [CHANGELOG.md](ipquorum-download-go/CHANGELOG.md) for details." >> release_notes.md
            fi
          else
            echo "Release $VERSION" > release_notes.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-assets/*
          body_path: release_notes.md
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Optional: Build and push Docker image
  docker:
    name: Build Docker Image
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/ipquorum-download-go
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./ipquorum-download-go
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max


